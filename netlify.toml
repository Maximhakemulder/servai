[build]
  publish   = "."
  functions = "netlify/functions"

# Broncode en databasebestanden horen niet publiek bereikbaar te zijn.
[[redirects]]
  from   = "/supabase/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/docs/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/netlify/*"
  to     = "/404.html"
  status = 404
  force  = true

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/beheer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
